[honeypot]
# Hostname shown to attackers - looks like a Raspberry Pi medical device
hostname = VitalsMonitor-RPi4

# Paths
log_path = /cowrie/var/log/cowrie
download_path = /cowrie/var/lib/cowrie/downloads
share_path = /cowrie/share/cowrie
state_path = /cowrie/var/lib/cowrie
etc_path = /cowrie/etc

# Fake sensor data output
sensor_name = VitalsMonitor-RPi4

# Timezone
timezone = Asia/Kolkata

# Log format - JSON for easy parsing
log_format = json

[ssh]
# Make SSH look like an old OpenSSH on Raspberry Pi OS
version = SSH-2.0-OpenSSH_7.4p1 Raspbian-10+deb9u7
# Listen on port 2222 inside container
listen_port = 2222
# Accept any username/password (logs them all)
auth_none_enabled = false

[telnet]
enabled = true
listen_port = 2223

[output_jsonlog]
enabled = true
logfile = /cowrie/var/log/cowrie/cowrie.json

[output_textlog]
enabled = true
logfile = /cowrie/var/log/cowrie/cowrie.log
